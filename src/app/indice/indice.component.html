<div class="row">
	<div class="col-md-1"></div>
	<div class="col-md-10 text-end">
		<a class="btn btn-primary" style="width: 100%;" routerLink="">Voltar ao Início</a>
	</div>
	<div class="col-md-1"></div>
</div>

<div class="row mt-4">
	<div class="col-12">
		<input class="form-control" name="dicbusca" [(ngModel)]="dicbusca" placeholder="Buscar termo no dicionário">
	</div>
	<div class="col-12 mt-2 text-center">
		<a class="btn btn-success" style="padding-left: auto; padding-right: auto;" [routerLink]="dicBusca()"><span style="font-size: 150%; line-height: 0.45em;">&#x2315;</span> Realizar Busca</a>
	</div>
</div>

<div class="row mt-4">
	<h5>Fushi-Português</h5>
	<div class="col-auto mb-1" *ngFor="let letra of indice_fushi">
		<a class="btn btn-sm btn-info letra-dicionario" routerLink="dic/fushi/{{ letra }}">
			{{ letra.toUpperCase() }}
		</a>
	</div>
</div>

<div class="row mt-4">
	<h5>Português-Fushi</h5>
	<div class="col-auto mb-1" *ngFor="let letra of indice_portuguese">
		<a class="btn btn-sm btn-success letra-dicionario" routerLink="dic/portuguese/{{ letra }}">
			{{ letra.toUpperCase() }}
		</a>
	</div>
</div>

<div class="row mt-4">
	<h5>Tópicos</h5>
	<div class="col-md-6">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('grammar')">
			<a class="btn btn-sm btn-primary topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
	<div class="col-md-6">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('writing')">
			<a class="btn btn-sm btn-success topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
	<div class="col-md-12 mt-2">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('other')">
			<a class="btn btn-sm btn-secondary topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
</div>
