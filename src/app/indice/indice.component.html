<div class="row">
	<div class="col-md-1"></div>
	<div class="col-md-10 text-end">
		<div class="row">
			<div class="col-md-12">
				<a class="btn btn-primary" style="width: 100%;" routerLink="">Voltar ao Início</a>
			</div>
		</div>
	</div>
	<div class="col-md-1"></div>
</div>

<div class="row mt-4">
	<div class="col-md-9">
		<input class="form-control" name="dicbusca" [(ngModel)]="dicbusca" placeholder="Buscar termo no dicionário">
	</div>
	<div class="col-md-3">
		<a class="btn btn-success" style="width: 100%;" [routerLink]="dicBusca()"><svg style="height: 20px !important; color: #def !important;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/></svg></a>
	</div>
</div>

<div class="row mt-4">
	<h5>Fushi-Português</h5>
	<div class="col-5th mb-2" *ngFor="let letra of indice_fushi">
		<a class="btn btn-sm btn-info letra-dicionario" routerLink="dic/fushi/{{ letra }}">
			{{ letra.toUpperCase() }}
		</a>
	</div>
</div>

<div class="row mt-4">
	<h5>Português-Fushi</h5>
	<div class="col-5th mb-2" *ngFor="let letra of indice_portuguese">
		<a class="btn btn-sm btn-success letra-dicionario" routerLink="dic/portuguese/{{ letra }}">
			{{ letra.toUpperCase() }}
		</a>
	</div>
</div>

<div class="row mt-4">
	<h5>Tópicos</h5>
	<div class="col-md-6">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('grammar')">
			<a class="btn btn-sm btn-primary topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
	<div class="col-md-6">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('writing')">
			<a class="btn btn-sm btn-success topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
	<div class="col-md-12 mt-2">
		<div class="row mt-2 align-top" *ngFor="let botao of getTopico('other')">
			<a class="btn btn-sm btn-secondary topico" routerLink="{{ botao.link }}">
				{{ botao.label }}
			</a>
		</div>
	</div>
</div>
